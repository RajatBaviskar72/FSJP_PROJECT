<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FSJP Project - Login and Register System" />
  <title>FSJP Project — Login & Register</title>
  <link rel="stylesheet" href="./style.css" />
  <!-- Google Font for clean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ===== AUTH CARD (Login + Register) ===== -->
  <div class="auth-container" id="authContainer">
    <div class="auth-card">

      <!-- Toggle Tabs -->
      <div class="auth-tabs">
        <button class="tab-btn active" id="loginTab" data-tab="login">Login</button>
        <button class="tab-btn" id="registerTab" data-tab="register">Register</button>
        <div class="tab-indicator" id="tabIndicator"></div>
      </div>

      <!-- Login Form -->
      <form class="auth-form active" id="loginForm">
        <h2>Welcome Back</h2>
        <p class="form-subtitle">Enter your credentials to access your account</p>

        <div class="input-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required />
        </div>

        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="submit-btn" id="loginBtn">Login</button>
        <div class="message" id="loginMessage"></div>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="registerForm">
        <h2>Create Account</h2>
        <p class="form-subtitle">Fill in the details to get started</p>

        <div class="input-group">
          <label for="registerName">Full Name</label>
          <input type="text" id="registerName" placeholder="John Doe" required />
        </div>

        <div class="input-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" placeholder="you@example.com" required />
        </div>

        <div class="input-group">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" placeholder="Create a password" required minlength="6" />
        </div>

        <button type="submit" class="submit-btn" id="registerBtn">Register</button>
        <div class="message" id="registerMessage"></div>
      </form>

    </div>
  </div>

  <!-- ===== DASHBOARD (shown after login) ===== -->
  <div class="dashboard-container hidden" id="dashboardContainer">
    <div class="dashboard-card">
      <div class="dashboard-avatar" id="dashboardAvatar">👤</div>
      <h1>Welcome, <span id="userName">User</span>!</h1>
      <p class="dashboard-subtitle">You are successfully logged in.</p>
      <div class="dashboard-info">
        <div class="info-item">
          <span class="info-label">Email</span>
          <span class="info-value" id="userEmail">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">Member Since</span>
          <span class="info-value" id="userDate">—</span>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
